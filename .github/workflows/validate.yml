name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference validator
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Skilloom skills
        run: |
          python tools/validate_skill.py skills/distill
          python tools/validate_skill.py skills/refine
          python tools/validate_skill.py skills/evolve
          python tools/validate_skill.py skills/consolidate
      - name: Test validation behavior
        run: python -m unittest discover -s tests -v
